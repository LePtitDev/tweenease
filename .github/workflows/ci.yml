name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

env:
  CI_NUGET_OUTPUT: ${{ github.workspace }}/nuget
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build_and_test:
    name: Build & Test Solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build solution
        run: dotnet build --configuration Release --no-restore
      - name: Test solution
        run: dotnet test --configuration Release --no-build --logger nunit
  package:
    name: Package Source Projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Package Source Projects
        run: dotnet pack "tweenease/tweenease.csproj" --configuration Release --output ${{ env.CI_NUGET_OUTPUT }}
      - name: Upload Artifacts (NuGet Packages)
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 3
          path: ${{ env.CI_NUGET_OUTPUT }}/**/*
  deploy:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs: [ build_and_test, package ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Artifacts (NuGet Packages)
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.CI_NUGET_OUTPUT }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish NuGet Packages
        run: for f in ${{ env.CI_NUGET_OUTPUT }}/*.nupkg; do dotnet nuget push "$f" --api-key ${{ env.CI_NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate; done
        env:
          CI_NUGET_API_KEY: ${{ secrets.CI_NUGET_API_KEY }}
